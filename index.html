<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0c0c0e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="KB Performance">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="format-detection" content="telephone=no">
  <meta name="description" content="7 Protocolli Kettlebell per Forza, Potenza, Velocità e Resistenza">
  <title>Kettlebells for Performance</title>

  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect fill='%230c0c0e' width='180' height='180'/%3E%3Cpath fill='none' stroke='%23c9b370' stroke-width='6' stroke-linejoin='round' d='M90 32L140 122H40Z M90 56L62 108H118Z M90 80L76 104H104Z'/%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0c0c0e;
      --bg-card: #151517;
      --bg-elevated: #1e1e22;
      --bg-input: #26262a;
      --line: #232327;

      --text: #f0ede6;
      --text-secondary: #c5c2ba;
      --text-dim: #9a978f;
      --text-muted: #5f5e5a;

      --gold: #c9b370;
      --gold-bright: #e0cc8a;
      --gold-dim: #a08a50;

      --work: #c9b370;
      --rest: #7f9bb0;
      --set-rest: #7fa36f;
      --prep: #8a877f;
      --danger: #c07070;

      --font-display: 'Cormorant Garamond', Georgia, serif;
      --font-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;

      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
      --tabbar-h: 62px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; }
    html { height: 100%; overflow: hidden; }
    body {
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--text);
      height: 100%;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      -webkit-text-size-adjust: 100%;
      font-variant-numeric: lining-nums;
      overscroll-behavior: none;
      overflow: hidden;
      position: fixed;
      width: 100%;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }
    button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; touch-action: manipulation; }
    textarea, input, select { font: inherit; color: inherit; user-select: text; -webkit-user-select: text; }
    :focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

    #app {
      height: 100%;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-y: contain;
      padding: var(--safe-top) var(--safe-right) 0 var(--safe-left);
    }
    #app.with-tabbar { padding-bottom: calc(var(--tabbar-h) + var(--safe-bottom)); }

    .flash-overlay { position: fixed; inset: 0; pointer-events: none; z-index: 9999; opacity: 0; transition: opacity .35s ease-out; }
    .flash-overlay.on { opacity: .28; transition: none; }

    .wrap { max-width: 620px; margin: 0 auto; }

    /* ───────── HOME ───────── */
    .hero { text-align: center; padding: 30px 20px 22px; position: relative; }
    .hero-icon { width: 46px; height: 46px; margin: 0 auto 14px; color: var(--gold); }
    .hero h1 { font-family: var(--font-display); font-size: 2rem; font-weight: 700; letter-spacing: .18em; line-height: 1.1; }
    .hero h2 { font-family: var(--font-display); font-size: 1.1rem; font-weight: 600; letter-spacing: .35em; color: var(--gold); margin-top: 6px; }
    .hero-tag { font-size: .62rem; font-weight: 600; letter-spacing: .1em; color: var(--text-dim); margin-top: 14px; text-transform: uppercase; }
    .hero-author { display: inline-block; font-family: var(--font-display); font-size: .9rem; font-weight: 600; letter-spacing: .1em; color: var(--gold-dim); margin-top: 6px; }

    .week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; padding: 0 16px; margin-bottom: 12px; }
    .day { text-align: center; padding: 8px 0 9px; border-radius: 10px; background: var(--bg-card); }
    .day b { display: block; font-size: .58rem; font-weight: 700; letter-spacing: .08em; color: var(--text-muted); }
    .day i { display: block; width: 8px; height: 8px; border-radius: 50%; margin: 6px auto 0; background: var(--bg-elevated); }
    .day.done i { background: var(--gold); box-shadow: 0 0 10px rgba(201,179,112,.5); }
    .day.today { outline: 1px solid var(--gold-dim); }
    .day.today b { color: var(--gold); }

    .kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 0 16px; }
    .kpi { background: var(--bg-card); border-radius: 12px; padding: 12px 10px; text-align: center; }
    .kpi-val { font-family: var(--font-display); font-size: 1.55rem; font-weight: 700; line-height: 1.05; }
    .kpi-val small { font-family: var(--font-body); font-size: .62rem; font-weight: 600; color: var(--text-dim); margin-left: 2px; }
    .kpi-lbl { font-size: .58rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--text-dim); margin-top: 4px; }

    .section-title { font-size: .66rem; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--text-dim); padding: 24px 18px 10px; display: flex; justify-content: space-between; align-items: baseline; }
    .section-title span { color: var(--text-muted); letter-spacing: .06em; }

    .list { display: flex; flex-direction: column; gap: 8px; padding: 0 12px; }
    .card {
      --accent: var(--gold);
      display: grid; grid-template-columns: 50px 1fr 18px; gap: 12px; align-items: center;
      width: 100%; text-align: left; padding: 14px 14px 14px 12px;
      background: var(--bg-card); border-radius: 14px; position: relative; overflow: hidden;
      transition: transform .12s, background .12s;
    }
    .card::before { content: ''; position: absolute; left: 0; top: 14px; bottom: 14px; width: 3px; border-radius: 0 3px 3px 0; background: var(--accent); opacity: .85; }
    .card:active { transform: scale(.985); background: var(--bg-elevated); }
    .card-icon { width: 46px; height: 46px; color: var(--accent); padding: 4px; border-radius: 12px; background: color-mix(in srgb, var(--accent) 9%, transparent); }
    .card-title { font-family: var(--font-display); font-size: 1.25rem; font-weight: 700; letter-spacing: .06em; line-height: 1.15; }
    .card-sub { font-size: .72rem; font-weight: 500; color: var(--text-dim); }
    .card-meta { display: flex; flex-wrap: wrap; gap: 4px 10px; margin-top: 6px; font-size: .68rem; font-weight: 600; color: var(--text-secondary); align-items: center; }
    .pips { display: inline-flex; gap: 2px; }
    .pips i { width: 5px; height: 10px; border-radius: 2px; background: var(--bg-input); }
    .pips i.on { background: var(--accent); }
    .card-last { font-size: .64rem; color: var(--text-muted); margin-top: 3px; font-weight: 500; }
    .card-arrow { font-family: var(--font-display); font-size: 1.5rem; color: var(--text-muted); }

    .footer { text-align: center; padding: 28px 20px 24px; font-size: .68rem; font-weight: 600; letter-spacing: .1em; color: var(--text-muted); }

    /* ───────── TAB BAR ───────── */
    .tabbar {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
      height: calc(var(--tabbar-h) + var(--safe-bottom)); padding-bottom: var(--safe-bottom);
      display: flex; justify-content: center;
      background: rgba(12,12,14,.88); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
      border-top: 1px solid var(--line);
    }
    .tabbar.hidden { display: none; }
    .tab { flex: 1; max-width: 200px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: var(--text-muted); font-size: .6rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
    .tab svg { width: 22px; height: 22px; }
    .tab.on { color: var(--gold); }

    /* ───────── GENERIC ───────── */
    .topbar { display: flex; justify-content: space-between; align-items: center; padding: 6px 8px; min-height: 56px; }
    .icon-btn { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 12px; color: var(--text-secondary); }
    .icon-btn:active { background: var(--bg-elevated); }
    .icon-btn svg { width: 22px; height: 22px; }
    .icon-btn.muted { color: var(--text-muted); }
    .back { display: inline-flex; align-items: center; gap: 4px; padding: 10px 8px; min-height: 44px; font-size: .88rem; font-weight: 600; color: var(--text-secondary); }
    .back svg { width: 18px; height: 18px; }

    .btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; font-size: .86rem; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; padding: 16px 20px; min-height: 54px; border-radius: 14px; transition: transform .1s, filter .1s; }
    .btn:active { transform: scale(.98); }
    .btn-primary { background: var(--gold); color: var(--bg); }
    .btn-primary:active { filter: brightness(.9); }
    .btn-secondary { background: var(--bg-elevated); color: var(--text); }
    .btn-ghost { border: 2px solid var(--bg-elevated); color: var(--text-secondary); }
    .btn-danger { background: rgba(192,112,112,.14); color: var(--danger); }
    .btn small { font-weight: 600; opacity: .7; letter-spacing: .04em; }
    .btn-row { display: flex; gap: 10px; }

    .chip { display: inline-flex; align-items: center; gap: 4px; font-size: .7rem; font-weight: 600; padding: 5px 10px; border-radius: 7px; background: var(--bg-elevated); color: var(--text-secondary); }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }

    .panel { background: var(--bg-card); border-radius: 14px; padding: 16px; }
    .panel + .panel { margin-top: 10px; }
    .panel h4 { font-size: .64rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--text-dim); margin-bottom: 10px; }
    .panel p { font-size: .88rem; color: var(--text-secondary); line-height: 1.6; }

    /* ───────── DETAIL ───────── */
    .detail { --accent: var(--gold); padding-bottom: calc(110px + var(--safe-bottom)); }
    .detail-hero { text-align: center; padding: 4px 20px 18px; position: relative; }
    .detail-hero::before { content: ''; position: absolute; left: 50%; top: -30px; width: 260px; height: 220px; transform: translateX(-50%); background: radial-gradient(closest-side, color-mix(in srgb, var(--accent) 22%, transparent), transparent); pointer-events: none; }
    .detail-icon { width: 72px; height: 72px; margin: 0 auto 10px; color: var(--accent); position: relative; }
    .detail-hero h1 { font-family: var(--font-display); font-size: 2.3rem; font-weight: 700; letter-spacing: .14em; line-height: 1; position: relative; }
    .detail-hero .sub { font-family: var(--font-display); font-size: 1.05rem; font-style: italic; color: var(--text-secondary); margin-top: 4px; position: relative; }
    .goal { display: inline-block; margin-top: 12px; font-size: .64rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); padding: 6px 12px; border-radius: 99px; border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent); position: relative; }
    .dstats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--line); border-radius: 14px; overflow: hidden; margin: 0 16px 10px; }
    .dstat { background: var(--bg-card); padding: 12px 4px; text-align: center; }
    .dstat b { display: block; font-family: var(--font-display); font-size: 1.2rem; font-weight: 700; line-height: 1.1; }
    .dstat span { font-size: .56rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--text-dim); }
    .dsec { padding: 0 16px; }

    .segbar { display: flex; height: 14px; gap: 2px; border-radius: 4px; overflow: hidden; }
    .segbar i { display: block; min-width: 1px; border-radius: 2px; }
    .seg-prep { background: var(--prep); opacity: .4; }
    .seg-work { background: var(--work); }
    .seg-rest { background: var(--rest); opacity: .55; }
    .seg-set_rest { background: var(--set-rest); opacity: .65; }
    .legend { display: flex; gap: 14px; margin-top: 10px; font-size: .68rem; font-weight: 600; color: var(--text-dim); }
    .legend span::before { content: ''; display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; background: var(--c); }
    .rules { margin-top: 10px; padding: 11px 13px; background: rgba(192,112,112,.12); border-left: 3px solid var(--danger); border-radius: 0 8px 8px 0; font-size: .82rem; font-weight: 500; color: var(--text-secondary); }

    .weight-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
    .wbtn { aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: var(--font-display); font-size: 1.25rem; font-weight: 700; line-height: 1; background: var(--bg-elevated); border: 2px solid transparent; border-radius: 11px; color: var(--text-secondary); transition: transform .1s; }
    .wbtn span { font-family: var(--font-body); font-size: .52rem; font-weight: 700; margin-top: 2px; opacity: .7; }
    .wbtn:active { transform: scale(.94); }
    .wbtn.sel { background: var(--gold); color: var(--bg); }
    .wbtn.used { border-color: var(--bg-input); }
    .whint { font-size: .74rem; color: var(--text-dim); margin-top: 10px; font-weight: 500; }
    .whint b { color: var(--text-secondary); }

    .sticky-cta { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; padding: 14px 16px calc(14px + var(--safe-bottom)); background: linear-gradient(transparent, var(--bg) 30%); }
    .sticky-cta .btn { max-width: 588px; margin: 0 auto; }

    /* ───────── TIMER ───────── */
    .timer {
      --phase: var(--prep);
      min-height: 100%; display: flex; flex-direction: column; align-items: center;
      padding: 0 16px calc(12px + var(--safe-bottom));
      background: radial-gradient(120% 70% at 50% 30%, color-mix(in srgb, var(--phase) 16%, transparent), transparent 70%);
      transition: background .4s;
    }
    .timer.ph-work { --phase: var(--work); }
    .timer.ph-rest { --phase: var(--rest); }
    .timer.ph-set_rest { --phase: var(--set-rest); }
    .timer .topbar { width: 100%; max-width: 520px; padding: 6px 0; }
    .t-title { text-align: center; line-height: 1.1; }
    .t-title b { display: block; font-family: var(--font-display); font-size: 1.15rem; font-weight: 700; letter-spacing: .12em; }
    .t-title span { font-size: .66rem; font-weight: 700; color: var(--gold); letter-spacing: .06em; }

    .t-progress { width: 100%; max-width: 520px; position: relative; margin: 2px 0 4px; }
    .t-progress .segbar { height: 8px; opacity: .55; }
    .t-fill { position: absolute; left: 0; top: -3px; bottom: -3px; width: 0; pointer-events: none; }
    .t-fill::after { content: ''; position: absolute; right: -1px; top: 0; bottom: 0; width: 2px; border-radius: 2px; background: var(--text); box-shadow: 0 0 8px var(--text); }
    .t-shade { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: rgba(12,12,14,.6); border-radius: 4px 0 0 4px; pointer-events: none; }
    .t-progress-lbl { display: flex; justify-content: space-between; font-size: .62rem; font-weight: 600; color: var(--text-dim); margin-top: 6px; font-variant-numeric: lining-nums tabular-nums; }

    .t-phase { margin-top: 10px; text-align: center; min-height: 58px; }
    .t-phase-lbl { font-size: .9rem; font-weight: 800; letter-spacing: .3em; color: var(--phase); text-transform: uppercase; transition: color .3s; }
    .t-phase-sub { font-family: var(--font-display); font-size: 1.6rem; font-weight: 700; letter-spacing: .04em; line-height: 1.2; min-height: 1.2em; }

    .t-ring { position: relative; width: min(64vw, 36vh, 300px); aspect-ratio: 1; margin: 6px 0; flex-shrink: 0; }
    .t-ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
    .ring-bg { fill: none; stroke: var(--bg-elevated); stroke-width: 7; }
    .ring-fg { fill: none; stroke: var(--phase); stroke-width: 7; stroke-linecap: round; transition: stroke .3s; }
    .t-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .t-time { font-family: var(--font-display); font-size: min(22vw, 13vh, 6.4rem); font-weight: 700; line-height: 1; font-variant-numeric: lining-nums tabular-nums; letter-spacing: .01em; }
    .t-time.small { font-size: min(17vw, 10vh, 5rem); }
    .t-under { font-size: .7rem; font-weight: 700; letter-spacing: .12em; color: var(--text-dim); text-transform: uppercase; margin-top: 4px; }
    .timer.paused .t-time { animation: blink 1.2s infinite; }
    @keyframes blink { 50% { opacity: .35; } }

    .t-stats { display: flex; gap: 8px; width: 100%; max-width: 520px; }
    .t-stat { flex: 1; background: var(--bg-card); border-radius: 12px; padding: 8px 6px; text-align: center; }
    .t-stat b { display: block; font-family: var(--font-display); font-size: 1.35rem; font-weight: 700; line-height: 1.1; font-variant-numeric: lining-nums tabular-nums; }
    .t-stat b small { font-size: .85rem; color: var(--text-dim); }
    .t-stat span { font-size: .56rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--text-dim); }

    .t-next { margin: 10px 0 2px; font-size: .78rem; font-weight: 600; color: var(--text-dim); min-height: 1.3em; text-align: center; }
    .t-next b { color: var(--text-secondary); }

    .reps { width: 100%; max-width: 520px; display: grid; grid-template-columns: 1fr 64px; gap: 8px; margin-top: 8px; }
    .rep-btn { padding: 12px 10px; border-radius: 16px; background: var(--bg-card); border: 2px solid color-mix(in srgb, var(--gold) 35%, transparent); display: flex; flex-direction: column; align-items: center; transition: transform .08s, background .08s; }
    .rep-btn.hit { transform: scale(.97); background: color-mix(in srgb, var(--gold) 14%, var(--bg-card)); }
    .rep-val { font-family: var(--font-display); font-size: 2.8rem; font-weight: 700; color: var(--gold); line-height: 1; font-variant-numeric: lining-nums tabular-nums; }
    .rep-lbl { font-size: .62rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--text-secondary); margin-top: 4px; }
    .rep-undo { border-radius: 16px; background: var(--bg-card); color: var(--text-dim); font-size: .7rem; font-weight: 800; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
    .rep-undo svg { width: 20px; height: 20px; }
    .rep-undo:active { background: var(--bg-elevated); }

    .t-controls { display: grid; grid-template-columns: 1fr 84px 1fr; align-items: center; gap: 14px; width: 100%; max-width: 360px; margin-top: auto; padding-top: 14px; }
    .ctl { height: 56px; border-radius: 16px; background: var(--bg-card); color: var(--text-secondary); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; font-size: .58rem; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; }
    .ctl svg { width: 20px; height: 20px; }
    .ctl:active { background: var(--bg-elevated); }
    .ctl-main { width: 84px; height: 84px; border-radius: 50%; background: var(--phase); color: var(--bg); box-shadow: 0 8px 30px color-mix(in srgb, var(--phase) 35%, transparent); transition: background .3s, transform .1s; }
    .ctl-main:active { transform: scale(.94); background: var(--phase); }
    .ctl-main svg { width: 32px; height: 32px; }

    /* ───────── SUMMARY ───────── */
    .summary { padding: 10px 16px calc(24px + var(--safe-bottom)); }
    .sum-hero { text-align: center; padding: 26px 0 18px; }
    .sum-hero svg { width: 54px; height: 54px; color: var(--gold); }
    .sum-hero h1 { font-family: var(--font-display); font-size: 2.6rem; font-weight: 700; letter-spacing: .24em; color: var(--gold); line-height: 1.1; margin-top: 10px; }
    .sum-hero p { font-size: .8rem; color: var(--text-dim); font-weight: 600; letter-spacing: .06em; }
    .pr-badge { display: inline-flex; align-items: center; gap: 6px; margin-top: 12px; padding: 7px 14px; border-radius: 99px; background: var(--gold); color: var(--bg); font-size: .7rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; animation: pop .5s cubic-bezier(.2,1.6,.4,1); }
    .pr-badge svg { width: 15px; height: 15px; }
    @keyframes pop { from { transform: scale(.4); opacity: 0; } }
    .sum-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 10px; }
    .sum-grid .kpi { padding: 14px 10px; }
    .bars { display: flex; align-items: flex-end; gap: 3px; height: 110px; }
    .bar { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 3px; min-width: 0; }
    .bar i { display: block; width: 100%; border-radius: 3px 3px 1px 1px; background: var(--gold); min-height: 2px; }
    .bar i.lo { background: var(--gold-dim); opacity: .7; }
    .bar b { font-size: .58rem; font-weight: 700; color: var(--text-secondary); font-variant-numeric: lining-nums tabular-nums; }
    .bar span { font-size: .52rem; color: var(--text-muted); font-weight: 600; }
    .rpe { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; }
    .rpe button { aspect-ratio: 1; border-radius: 8px; background: var(--bg-elevated); font-weight: 800; font-size: .82rem; color: var(--text-secondary); }
    .rpe button.target { box-shadow: inset 0 0 0 1px var(--gold-dim); }

      for (var i = 0; i < keys.length; i++) if (!clipBuf[keys[i]]) return false;
      var c = audio(); if (!c) return false;
      stopClips();
      var t = c.currentTime + 0.005;
      keys.forEach(function (k) {
        var s = c.createBufferSource(); s.buffer = clipBuf[k]; s.connect(master); s.start(t);
        t += clipBuf[k].duration + (gap == null ? 0.06 : gap);
        voiceSrc.push(s);
      });
      return true;
    }
    function voiceOn() { return settings.voice && !settings.muted && (hasTTS || (useClips() && Object.keys(clipBuf).length > 0)); }
    // text = frase per la voce sintetica · keys = clip registrate equivalenti
    function say(text, keys, gap) {
      if (!voiceOn() || !text) return;
      if (useClips() && keys && playClips([].concat(keys), gap)) { if (hasTTS) try { speechSynthesis.cancel(); } catch (e) {} return; }
      if (!hasTTS) return;
      stopClips();
      try {
        speechSynthesis.cancel();
        var u = new SpeechSynthesisUtterance(text);
        u.lang = 'it-IT'; u.rate = 1.15; u.pitch = 1; u.volume = Math.min(1, settings.volume + 0.1);
        var vv = null;
        for (var i = 0; i < voices.length; i++) if (voices[i].voiceURI === settings.voiceURI) vv = voices[i];
        if (!vv && voices.length) vv = voices[0];
        if (vv) u.voice = vv;
        speechSynthesis.speak(u);
      } catch (e) {}
    }
    function hush() { stopClips(); if (hasTTS) try { speechSynthesis.cancel(); } catch (e) {} }
    function applyAudioSession() {
      // Safari iOS 17+: 'playback' suona anche con l'interruttore silenzioso (ma interrompe la musica di altre app)
      try { if (navigator.audioSession) navigator.audioSession.type = settings.ignoreSilent ? 'playback' : 'auto'; } catch (e) {}
    }
    function unlock() {
      applyAudioSession();
      audio();
      if (hasTTS) try { var u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u); } catch (e) {}
    }
    function buzz(p) { if (settings.haptics) try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} }
    var flashT = null;
    function flash(color) {
      if (!settings.flash) return;
      var el = $('#flash'); el.style.background = color; el.classList.add('on');
      clearTimeout(flashT); flashT = setTimeout(function () { el.classList.remove('on'); }, 90);
    }

    // Wake lock
    var wakeLock = null;
    function lockScreen() {
      if (!('wakeLock' in navigator) || wakeLock) return;
      navigator.wakeLock.request('screen').then(function (l) {
        wakeLock = l;
        l.addEventListener('release', function () { wakeLock = null; });
      }).catch(function () {});
    }
    function unlockScreen() { if (wakeLock) { try { wakeLock.release(); } catch (e) {} wakeLock = null; } }
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'visible' && R.active && !R.done) { lockScreen(); audio(); tick(); }
    });

    // ═══════════════════════════════════════════════════════════════
    // TIMER ENGINE · timeline pre-calcolata, nessun drift
    // ═══════════════════════════════════════════════════════════════
    function buildTimeline(p, prep, rnd) {
      var tl = [], t = 0, n = 0, prevEx = null;
      function push(o) { o.t0 = t; t += o.dur; tl.push(o); }
      if (prep) push({ type: 'prep', dur: prep, set: 1, round: 1 });
      for (var s = 1; s <= p.sets; s++) {
        for (var r = 1; r <= p.rounds; r++) {
          var ex = null;
          if (p.random && rnd) { do { ex = p.ex[Math.floor(Math.random() * p.ex.length)]; } while (ex === prevEx && p.ex.length > 1); prevEx = ex; }
          push({ type: 'work', dur: p.work, set: s, round: r, n: ++n, ex: ex });
          var lastR = r === p.rounds, lastS = s === p.sets;
          // ogni round ha il suo riposo (blocchi da durata piena); si omette solo l'ultimo riposo della sessione
          if (p.rest > 0 && !(lastR && lastS)) push({ type: 'rest', dur: p.rest, set: s, round: r });
        }
        if (s < p.sets && p.setRest > 0) push({ type: 'set_rest', dur: p.setRest, set: s, round: p.rounds });
      }
      return tl;
    }
    function tlTotal(tl) { var l = tl[tl.length - 1]; return l.t0 + l.dur; }
    function planned(p) { return tlTotal(buildTimeline(p, 0, false)); }
    function legacyPlanned(p) { return p.sets * p.rounds * p.work + p.sets * (p.rounds - 1) * p.rest + (p.sets - 1) * p.setRest; }

    var R = { active: false };
    var loopRAF = null, loopInt = null;

    function elapsed() { return (R.acc + (R.running ? performance.now() - R.resumeAt : 0)) / 1000; }
    function workElapsed() { return Math.max(0, elapsed() - R.prepDur); }

    function startWorkout(pid) {
      var p = byId[pid];
      unlock();
      var tl = buildTimeline(p, settings.prep, true);
      R = {
        active: true, p: p, kg: kgFor(pid), tl: tl, total: tlTotal(tl), prepDur: settings.prep, works: p.sets * p.rounds,
        idx: 0, acc: 0, resumeAt: performance.now(), running: true, done: false, lastSec: null, workN: 0,
        roundReps: [], tapTimes: [], startedAt: new Date().toISOString(), skipped: 0, paused: false
      };
      ui.view = 'timer';
      pushNav();
      render();
      onPhaseStart(tl[0], true);
      lockScreen();
      startLoops();
    }
    function startLoops() {
      stopLoops();
      var frame = function () { tick(); loopRAF = requestAnimationFrame(frame); };
      loopRAF = requestAnimationFrame(frame);
      loopInt = setInterval(tick, 250); // continua anche con rAF in pausa (tab in background)
    }
    function stopLoops() { if (loopRAF) cancelAnimationFrame(loopRAF); if (loopInt) clearInterval(loopInt); loopRAF = loopInt = null; }

    function tick() {
      if (!R.active || R.done) return;
      var e = elapsed();
      while (R.idx < R.tl.length && e >= R.tl[R.idx].t0 + R.tl[R.idx].dur) {
        var lag = e - (R.tl[R.idx].t0 + R.tl[R.idx].dur);
        R.idx++;
        if (R.idx >= R.tl.length) { finish(true, lag < 1); return; }
        onPhaseStart(R.tl[R.idx], lag < 0.8); // transizioni già passate (es. schermo bloccato) restano silenziose
      }
      var ph = R.tl[R.idx];
      var rem = ph.t0 + ph.dur - e;
      var sec = Math.ceil(rem - 1e-6);
      if (sec !== R.lastSec) { R.lastSec = sec; if (R.running) onSecond(ph, sec); }
      updateTimer();
    }

    function nextPhase(i) { return R.tl[(i == null ? R.idx : i) + 1] || null; }

    function onPhaseStart(ph, live) {
      R.lastSec = null;
      if (ph.type === 'work') R.workN = ph.n;
      if (!live) return;
      var p = R.p;
      if (ph.type === 'prep') {
        if (ph.dur > 5) {
          var ex0 = p.random && nextPhase(0) ? nextPhase(0).ex : null;
          say('Preparati. ' + (ex0 ? 'Si parte con ' + ex0 : ''), ex0 ? ['preparati', 'ex:' + ex0] : 'preparati', 0.25);
        }
      } else if (ph.type === 'work') {
        var first = ph.n === 1;
        if (p.emom && !first) sfx('minute'); else sfx('go');
        buzz([220]); flash('#c9b370');
        var line, key;
        if (ph.ex) { line = ph.ex; key = 'ex:' + ph.ex; }
        else if (R.works > 1 && ph.n === R.works) { line = p.emom ? 'Ultimo minuto' : 'Ultimo round'; key = p.emom ? 'ultimo_minuto' : 'ultimo_round'; }
        else if (p.sets > 1 && ph.round === 1 && ph.set > 1) { line = 'Serie ' + ph.set + '. Via'; key = 'serie_' + ph.set; }
        else if (p.emom && !first) line = null;
        else { line = 'Via'; key = 'via'; }
        if (line) say(line, key);
      } else if (ph.type === 'rest') {
        sfx('rest'); buzz([100]); flash('#7f9bb0'); say('Riposo', 'riposo');
      } else if (ph.type === 'set_rest') {
        sfx('rest'); buzz([100, 60, 100]); flash('#7fa36f');
        say('Recupero. ' + Math.round(ph.dur / 60) + ' minuti', 'recupero_' + Math.round(ph.dur / 60));
      }
    }

    function onSecond(ph, sec) {
      var n = settings.count;
      var limit = ph.type === 'prep' ? Math.min(n || 3, ph.dur) : Math.min(n, Math.max(0, ph.dur - 2));
      var voiced = voiceOn() && n > 0;
      if (sec >= 1 && sec <= limit && voiced) { say(NUM[sec], 'n' + sec); return; }
      if (sec >= 1 && sec <= 3 && !voiced && ph.dur > 4) { sfx('tick'); return; }
      if (ph.dur >= 90 && sec < ph.dur && sec > limit) {
        if (sec % 60 === 0) say(sec === 60 ? 'Un minuto' : (sec / 60) + ' minuti', 'min_' + sec / 60);
        else if (sec === 30) say('Trenta secondi', 'sec_30');
      }
      var nx = nextPhase();
      if (sec === 10 && ph.dur >= 30 && nx && nx.ex) say('Prossimo: ' + nx.ex, 'next:' + nx.ex);
    }

    function togglePause() {
      if (!R.active || R.done) return;
      if (R.running) {
        R.acc += performance.now() - R.resumeAt; R.running = false; hush(); unlockScreen();
        if (R.tl[R.idx].type !== 'prep') R.paused = true;
      }
      else { unlock(); R.resumeAt = performance.now(); R.running = true; lockScreen(); }
      R.lastSec = null;
      updateTimer(true);
    }
    function skipPhase() {
      if (!R.active || R.done) return;
      var ph = R.tl[R.idx], e = elapsed();
      var jump = ph.t0 + ph.dur - e;
      if (ph.type !== 'prep') R.skipped += jump; // il tempo saltato non conta come lavoro svolto
      R.acc += jump * 1000 + 1;
      tick();
      updateTimer(true);
    }

    function addRep() {
      if (!R.active || R.done) return;
      var ph = R.tl[R.idx];
      if (ph.type === 'prep') return;
      if (R.p.track === 'round') { var i = R.workN - 1; R.roundReps[i] = (R.roundReps[i] || 0) + 1; }
      else R.tapTimes.push(workElapsed());
      buzz(18);
      var b = $('#repBtn'); if (b) { b.classList.add('hit'); setTimeout(function () { b.classList.remove('hit'); }, 90); }
      updateTimer(true);
    }
    function undoRep() {
      if (!R.active || R.done) return;
      if (R.p.track === 'round') {
        for (var i = R.workN - 1; i >= 0; i--) if (R.roundReps[i] > 0) { R.roundReps[i]--; break; }
      } else R.tapTimes.pop();
      buzz(10);
      updateTimer(true);
    }
    function totalReps() { return R.p.track === 'round' ? sum(R.roundReps.filter(Boolean)) : R.tapTimes.length; }

    function finish(completed, live) {
      if (!R.active || R.done) return;
      if (R.running) { R.acc += performance.now() - R.resumeAt; R.running = false; }
      R.done = true;
      stopLoops(); unlockScreen();
      if (live) { sfx('end'); say(completed ? 'Tempo! Ottimo lavoro.' : 'Sessione terminata', completed ? 'fine_ok' : 'fine_stop'); buzz([100, 50, 100, 50, 300]); flash('#c9b370'); }
      else hush();
      var p = R.p, dur = Math.max(0, Math.min(workElapsed(), R.total - R.prepDur) - R.skipped);
      var entry = { id: Date.now().toString(36), pid: p.id, date: R.startedAt, kg: R.kg, dur: Math.round(dur), planned: R.total - R.prepDur, completed: completed, rpe: null, notes: '',
        skipped: Math.round(R.skipped), paused: R.paused };
      if (p.track === 'round') {
        var rr = []; for (var i = 0; i < R.works; i++) rr.push(R.roundReps[i] || 0);
        if (!completed) rr = rr.slice(0, Math.max(1, R.workN));
        entry.rounds = rr; entry.reps = sum(rr);
      } else if (p.track === 'total') {
        var pm = []; var mins = Math.ceil(p.work / 60);
        for (var m = 0; m < mins; m++) pm.push(0);
        R.tapTimes.forEach(function (t) { pm[Math.min(mins - 1, Math.floor(t / 60))]++; });
        if (!completed) {
          var lastBucket = R.tapTimes.length ? Math.min(mins - 1, Math.floor(R.tapTimes[R.tapTimes.length - 1] / 60)) : 0;
          pm = pm.slice(0, Math.max(1, Math.ceil(workElapsed() / 60), lastBucket + 1));
        }

      }
      if (p.track === 'total') {
        var prev = bestFor(p.id, R.kg);
        entry.prevBest = prev ? prev.reps : null;
        entry.pr = validResult(entry) && (!prev || entry.reps > prev.reps);
      }
      history.unshift(entry); saveHistory();
      R.active = false;
      ui.summaryId = entry.id; ui.view = 'summary';
      render();
    }

    function abandon() { stopLoops(); unlockScreen(); hush(); R = { active: false }; go('detail'); }

    // ═══════════════════════════════════════════════════════════════
    // DATI STORICO
    // ═══════════════════════════════════════════════════════════════
    function lastFor(pid) { for (var i = 0; i < history.length; i++) if (history[i].pid === pid) return history[i]; return null; }
    function bestFor(pid, kg) {
      var b = null;
      history.forEach(function (h) { if (h.pid === pid && validResult(h) && h.reps != null && (kg == null || h.kg === kg) && (!b || h.reps > b.reps)) b = h; });
      return b;
    }
    function tonnage(h) { return h.reps ? h.reps * h.kg : 0; }
    function weekCount() { var lim = Date.now() - 7 * 864e5; return history.filter(function (h) { return new Date(h.date).getTime() >= lim; }).length; }
    function streakWeeks() {
      // settimane consecutive (lun-dom) con almeno una sessione, inclusa quella corrente
      function wk(d) { d = new Date(d); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return d.getTime(); }
      var set = {}; history.forEach(function (h) { set[wk(h.date)] = 1; });
      var cur = wk(new Date()), n = 0;
      if (!set[cur]) cur -= 7 * 864e5;
      while (set[cur]) { n++; cur -= 7 * 864e5; }
      return n;
    }

    // ═══════════════════════════════════════════════════════════════
    // NAVIGAZIONE
    // ═══════════════════════════════════════════════════════════════
    var tabViews = { home: 1, history: 1, settings: 1 };
    function go(view, pid) {
      if (pid) ui.pid = pid;
      ui.view = view;
      if (!tabViews[view]) pushNav();
      render();
      $('#app').scrollTop = 0;
    }
    function pushNav() { try { history_.pushState({ v: ui.view }, ''); } catch (e) {} }
    var history_ = window.history;
    window.addEventListener('popstate', function () {
      if (ui.modal) { closeModal(true); pushNav(); return; }
      if (ui.view === 'timer' && R.active) { confirmExit(); pushNav(); return; }
      if (ui.view === 'timer' || ui.view === 'summary') { ui.view = 'home'; render(); return; }
      if (ui.view === 'detail') { ui.view = 'home'; render(); }
    });

    // ═══════════════════════════════════════════════════════════════
    // RENDER
    // ═══════════════════════════════════════════════════════════════
    var app = $('#app'), tabbar = $('#tabbar');
    var TV = null; // riferimenti DOM del timer

    function render() {
      TV = null;
      var showTabs = !!tabViews[ui.view];
      app.classList.toggle('with-tabbar', showTabs);
      tabbar.classList.toggle('hidden', !showTabs);
      if (showTabs) tabbar.innerHTML = renderTabs();
      if (ui.view === 'home') app.innerHTML = renderHome();
      else if (ui.view === 'detail') app.innerHTML = renderDetail();
      else if (ui.view === 'timer') mountTimer();
      else if (ui.view === 'summary') app.innerHTML = renderSummary();
      else if (ui.view === 'history') app.innerHTML = renderHistory();
      else if (ui.view === 'settings') app.innerHTML = renderSettings();
    }

    function renderTabs() {
      var t = [['home', I.grid, 'Protocolli'], ['history', I.chart, 'Storico'], ['settings', I.gear, 'Impostazioni']];
      return t.map(function (x) { return '<button class="tab ' + (ui.view === x[0] ? 'on' : '') + '" data-act="tab" data-v="' + x[0] + '" aria-label="' + x[2] + '">' + x[1] + '<span>' + x[2] + '</span></button>'; }).join('');
    }

    function pips(rpe) {
      var hi = parseInt(String(rpe).split('-').pop(), 10), lvl = Math.round(hi / 2), h = '<span class="pips" aria-label="Intensità ' + lvl + ' su 5">';
      for (var i = 1; i <= 5; i++) h += '<i class="' + (i <= lvl ? 'on' : '') + '"></i>';
      return h + '</span>';
    }

    function renderHome() {
      var h = '<div class="wrap">';
      h += '<header class="hero"><div class="hero-icon">' + I.valknut + '</div><h1>KETTLEBELLS</h1><h2>FOR PERFORMANCE</h2>';
      h += '<p class="hero-tag">7 Protocolli · Forza · Potenza · Velocità · Resistenza</p><span class="hero-author">Nicholas Rubini</span></header>';

      // settimana
      var done = {}; history.forEach(function (x) { done[dayKey(x.date)] = 1; });
      var letters = ['D', 'L', 'M', 'M', 'G', 'V', 'S'];
      h += '<div class="week" aria-label="Ultimi 7 giorni">';
      for (var i = 6; i >= 0; i--) {
        var d = new Date(); d.setDate(d.getDate() - i);
        h += '<div class="day ' + (done[dayKey(d)] ? 'done ' : '') + (i === 0 ? 'today' : '') + '"><b>' + letters[d.getDay()] + '</b><i></i></div>';
      }
      h += '</div>';

      var vkg = kgFor('valhalla'), best = bestFor('valhalla', vkg);
      h += '<div class="kpis">';
      h += '<div class="kpi"><div class="kpi-val">' + weekCount() + '</div><div class="kpi-lbl">7 giorni</div></div>';
      h += '<div class="kpi"><div class="kpi-val">' + streakWeeks() + '<small>sett.</small></div><div class="kpi-lbl">Streak</div></div>';
      h += '<div class="kpi"><div class="kpi-val">' + (best ? best.reps : '—') + '</div><div class="kpi-lbl">Valhöll ' + vkg + 'kg</div></div>';
      h += '</div>';

      h += '<div class="section-title">Protocolli<span>' + history.length + ' sessioni totali</span></div><div class="list">';
      PROTOCOLS.forEach(function (p) {
        var last = lastFor(p.id);
        h += '<button class="card" style="--accent:' + p.accent + '" data-act="open" data-id="' + p.id + '">';
        h += '<div class="card-icon">' + I[p.id] + '</div><div>';
        h += '<div class="card-title">' + p.name + '</div><div class="card-sub">' + p.sub + '</div>';
        h += '<div class="card-meta"><span>' + p.type + '</span><span>' + fmtMin(planned(p)) + '</span>' + pips(p.rpe) + '</div>';
        if (last) h += '<div class="card-last">Ultima: ' + relDay(last.date) + ' · ' + last.kg + 'kg' + (last.reps != null ? ' · ' + last.reps + ' rep' : '') + '</div>';
        h += '</div><div class="card-arrow">›</div></button>';
      });
      h += '</div><footer class="footer">NicholasRubini.it</footer></div>';
      return h;
    }

    function segbar(tl) {
      var tot = tlTotal(tl);
      return '<div class="segbar">' + tl.map(function (s) { return '<i class="seg-' + s.type + '" style="flex:' + (s.dur / tot).toFixed(5) + ' 0 0"></i>'; }).join('') + '</div>';
    }

    function renderDetail() {
      var p = byId[ui.pid], kg = kgFor(p.id), tl = buildTimeline(p, 0, false), last = lastFor(p.id);
      var h = '<div class="detail wrap" style="--accent:' + p.accent + '">';
      h += '<div class="topbar"><button class="back" data-act="home">' + I.back + ' Protocolli</button></div>';
      h += '<div class="detail-hero"><div class="detail-icon">' + I[p.id] + '</div><h1>' + p.name + '</h1><div class="sub">' + p.sub + '</div><div class="goal">' + p.goal + '</div></div>';
      var struct = p.emom ? p.rounds + '×1′' : p.track === 'total' ? '5′' : p.work + '″:' + p.rest + '″';
      h += '<div class="dstats">';
      h += '<div class="dstat"><b>' + fmtMin(planned(p)) + '</b><span>Durata</span></div>';
      h += '<div class="dstat"><b>' + struct + '</b><span>' + (p.emom ? 'EMOM' : p.track === 'total' ? 'Test' : 'Work:Rest') + '</span></div>';
      h += '<div class="dstat"><b>' + p.rpe + '</b><span>RPE</span></div>';
      h += '<div class="dstat"><b>Z' + p.zone + '</b><span>Zona ind.</span></div>';
      h += '</div><div class="dsec">';

      h += '<div class="panel"><h4>Come funziona</h4><p>' + p.desc + '</p>';
      if (p.reps) h += '<p style="margin-top:8px"><b style="color:var(--text)">' + p.reps + ' ripetizioni</b> per minuto.</p>';
      if (p.rules) h += '<div class="rules">⚠ ' + p.rules + '</div>';
      h += '</div>';

      h += '<div class="panel"><h4>Struttura · ' + (p.sets > 1 ? p.sets + ' serie × ' : '') + p.rounds + ' round</h4>' + segbar(tl);
      h += '<p class="whint" style="margin:10px 0">Zona e RPE sono indicazioni di riferimento, non misure individuali.</p><div class="legend"><span style="--c:var(--work)">Lavoro</span>' + (p.rest ? '<span style="--c:var(--rest)">Riposo</span>' : '') + (p.setRest ? '<span style="--c:var(--set-rest)">Recupero ' + p.setRest / 60 + '′</span>' : '') + '</div></div>';

      h += '<div class="panel"><h4>' + (p.random ? 'Pool esercizi casuali' : 'Esercizi') + '</h4><div class="chips">' + p.ex.map(function (x) { return '<span class="chip">' + x + '</span>'; }).join('') + '</div></div>';

      var used = {}; history.forEach(function (x) { if (x.pid === p.id) used[x.kg] = 1; });
      h += '<div class="panel"><h4>Peso kettlebell</h4><div class="weight-grid">';
      WEIGHTS.forEach(function (w) { h += '<button class="wbtn ' + (w === kg ? 'sel ' : '') + (used[w] ? 'used' : '') + '" data-act="kg" data-kg="' + w + '">' + w + '<span>kg</span></button>'; });
      h += '</div>';
      if (p.track === 'total') {
        var b = bestFor(p.id, kg);
        h += '<p class="whint">' + (b ? 'Record a ' + kg + 'kg: <b>' + b.reps + ' rep</b> (' + relDay(b.date) + ')' : 'Nessun test registrato a ' + kg + 'kg') + '</p>';
      } else if (last) {
        h += '<p class="whint">Ultima sessione: <b>' + last.kg + 'kg</b>, ' + relDay(last.date) + (last.rpe ? ' · RPE ' + last.rpe : '') + (last.reps != null ? ' · ' + last.reps + ' rep' : '') + '</p>';
      }
      h += '</div></div></div>';
      h += '<div class="sticky-cta"><button class="btn btn-primary" data-act="start">Inizia · ' + kg + 'kg <small>' + fmt(planned(p)) + '</small></button></div>';
      return h;
    }

    // ───────── TIMER VIEW ─────────
    var CIRC = 2 * Math.PI * 92;
    function mountTimer() {
      var p = R.p, muted = settings.muted;
      var h = '<div class="timer" id="tv">';
      h += '<div class="topbar"><button class="icon-btn" data-act="exit" aria-label="Esci">' + I.close + '</button>';
      h += '<div class="t-title"><b>' + p.name + '</b><span>' + R.kg + 'kg' + (p.reps ? ' · ' + p.reps + ' rep/min' : '') + '</span></div>';
      h += '<button class="icon-btn ' + (muted ? 'muted' : '') + '" data-act="mute" id="muteBtn" aria-label="Audio">' + (muted ? I.muted : I.volume) + '</button></div>';

      h += '<div class="t-progress">' + segbar(R.tl) + '<div class="t-shade" id="tShade"></div><div class="t-fill" id="tFill"></div>';
      h += '<div class="t-progress-lbl"><span id="tEl">00:00</span><span id="tRem">-' + fmt(R.total) + '</span></div></div>';

      h += '<div class="t-phase" aria-live="polite"><div class="t-phase-lbl" id="tLbl"></div><div class="t-phase-sub" id="tSub"></div></div>';

      h += '<div class="t-ring"><svg viewBox="0 0 200 200"><circle cx="100" cy="100" r="92" class="ring-bg"/><circle cx="100" cy="100" r="92" class="ring-fg" id="tRing" style="stroke-dasharray:' + CIRC + '"/></svg>';
      h += '<div class="t-center"><div class="t-time" id="tTime">00:00</div><div class="t-under" id="tUnder"></div></div></div>';

      h += '<div class="t-stats">';
      if (p.sets > 1) h += '<div class="t-stat"><b id="tSet"></b><span>Serie</span></div>';
      if (p.rounds > 1) h += '<div class="t-stat"><b id="tRound"></b><span>' + (p.emom ? 'Minuto' : 'Round') + '</span></div>';
      if (p.track) h += '<div class="t-stat"><b id="tAux1"></b><span id="tAux1L"></span></div>';
      if (p.track === 'total') h += '<div class="t-stat"><b id="tAux2"></b><span id="tAux2L"></span></div>';
      h += '</div>';
      h += '<div class="t-next" id="tNext"></div>';

      if (p.track) {
        h += '<div class="reps"><button class="rep-btn" id="repBtn" aria-label="Aggiungi ripetizione"><span class="rep-val" id="tReps">0</span><span class="rep-lbl" id="tRepLbl">Tap per rep</span></button>';
        h += '<button class="rep-undo" data-act="undo" aria-label="Annulla ultima rep">' + I.undo + '−1</button></div>';
      }

      h += '<div class="t-controls">';
      h += '<button class="ctl" data-act="exit">' + I.stop + 'Termina</button>';
      h += '<button class="ctl ctl-main" data-act="pause" id="pauseBtn" aria-label="Pausa">' + I.pause + '</button>';
      h += '<button class="ctl" data-act="skip">' + I.skip + 'Salta</button>';
      h += '</div></div>';
      app.innerHTML = h;

      TV = {
        root: $('#tv'), lbl: $('#tLbl'), sub: $('#tSub'), ring: $('#tRing'), time: $('#tTime'), under: $('#tUnder'),
        set: $('#tSet'), round: $('#tRound'), next: $('#tNext'), fill: $('#tFill'), shade: $('#tShade'), el: $('#tEl'), rem: $('#tRem'),
        reps: $('#tReps'), repLbl: $('#tRepLbl'), aux1: $('#tAux1'), aux1L: $('#tAux1L'), aux2: $('#tAux2'), aux2L: $('#tAux2L'),
        pause: $('#pauseBtn'), cache: {}, idx: -1, running: null
      };
      var rb = $('#repBtn');
      if (rb) rb.addEventListener('pointerdown', function (ev) { ev.preventDefault(); addRep(); });
      updateTimer(true);
    }

    function txt(el, key, val, html) {
      if (!el || TV.cache[key] === val) return;
      TV.cache[key] = val;
      if (html) el.innerHTML = val; else el.textContent = val;
    }

    function updateTimer(force) {
      if (!TV || !R.tl) return;
      var p = R.p, e = Math.min(elapsed(), R.total), ph = R.tl[R.idx];
      var rem = Math.max(0, ph.t0 + ph.dur - e);
      TV.ring.style.strokeDashoffset = (CIRC * (1 - rem / ph.dur)).toFixed(2);
      var pct = (e / R.total * 100).toFixed(2) + '%';
      TV.fill.style.width = pct; TV.shade.style.width = pct;
      txt(TV.time, 'time', fmt(Math.ceil(rem - 1e-6)));
      txt(TV.el, 'el', fmt(e));
      txt(TV.rem, 'rem', '-' + fmt(R.total - e));

      if (TV.idx !== R.idx || force) {
        TV.idx = R.idx;
        TV.root.className = 'timer ph-' + ph.type + (R.running ? '' : ' paused');
        TV.time.classList.toggle('small', ph.dur >= 600);
        txt(TV.lbl, 'lbl', LABEL[ph.type]);
        var sub = '';
        if (ph.type === 'work') sub = ph.ex || (p.track === 'total' ? 'Snatch' : p.emom ? p.reps + ' rep' : p.track === 'round' ? 'Max rep' : '');
        else if (ph.type === 'prep') sub = R.p.random && R.tl[1] ? R.tl[1].ex : '';
        txt(TV.sub, 'sub', sub);
        if (TV.set) txt(TV.set, 'set', ph.set + '<small>/' + p.sets + '</small>', true);
        var rnd = ph.type === 'prep' ? 0 : ph.round;
        if (TV.round) txt(TV.round, 'round', rnd + '<small>/' + p.rounds + '</small>', true);
        var nx = nextPhase();
        var nt = nx ? 'Prossimo · <b>' + LABEL[nx.type] + (nx.ex ? ': ' + esc(nx.ex) : '') + '</b> ' + fmt(nx.dur) : 'Ultima fase · <b>Fine</b>';
        txt(TV.next, 'next', nt, true);
      }
      if (TV.running !== R.running || force) {
        TV.running = R.running;
        TV.root.classList.toggle('paused', !R.running);
        TV.pause.innerHTML = R.running ? I.pause : I.play;
        TV.pause.setAttribute('aria-label', R.running ? 'Pausa' : 'Riprendi');
        txt(TV.under, 'under', R.running ? (ph.type === 'work' && p.emom ? 'al prossimo minuto' : '') : 'In pausa');
      }

      if (p.track === 'round' && TV.reps) {
        var i = Math.max(0, R.workN - 1), cur = R.roundReps[i] || 0, prev = i > 0 ? (R.roundReps[i - 1] || 0) : null;
        txt(TV.reps, 'reps', String(cur));
        txt(TV.repLbl, 'repl', 'Rep round ' + Math.max(1, R.workN) + (prev != null ? ' · prec. ' + prev : ''));
        txt(TV.aux1, 'a1', String(totalReps())); txt(TV.aux1L, 'a1l', 'Totale');
      } else if (p.track === 'total' && TV.reps) {
        var n = R.tapTimes.length, we = workElapsed();
        txt(TV.reps, 'reps', String(n));
        txt(TV.repLbl, 'repl', 'Tap per rep');
        var pace = we > 5 ? n / we * 60 : 0;
        txt(TV.aux1, 'a1', pace ? pace.toFixed(1) : '—'); txt(TV.aux1L, 'a1l', 'Rep/min');
        var proj = we > 20 ? Math.round(n / we * p.work) : null;
        var best = bestFor(p.id, R.kg);
        var a2 = proj != null ? String(proj) : '—';
        if (proj != null && best) a2 = proj + '<small style="color:' + (proj >= best.reps ? 'var(--set-rest)' : 'var(--danger)') + '"> ' + (proj >= best.reps ? '+' : '') + (proj - best.reps) + '</small>';
        txt(TV.aux2, 'a2', a2, true); txt(TV.aux2L, 'a2l', best ? 'Proiez. vs PR' : 'Proiezione');
      }
    }

    // ───────── SUMMARY ─────────
    function barsHTML(vals, labelFn) {
      var max = Math.max.apply(null, vals.concat([1])), avg = sum(vals) / (vals.length || 1);
      return '<div class="bars">' + vals.map(function (v, i) {
        return '<div class="bar"><b>' + v + '</b><i class="' + (v < avg * 0.85 ? 'lo' : '') + '" style="height:' + Math.max(2, v / max * 80) + '%"></i><span>' + labelFn(i) + '</span></div>';
      }).join('') + '</div>';
    }

    function renderSummary() {
      var s = history.filter(function (x) { return x.id === ui.summaryId; })[0];
      if (!s) { ui.view = 'home'; return renderHome(); }
      var p = byId[s.pid];
      var h = '<div class="summary wrap">';
      h += '<div class="sum-hero">' + (s.completed ? I.valknut + '<h1>GLORIA</h1>' : '<h1 style="font-size:1.8rem;letter-spacing:.12em;color:var(--text)">TERMINATO</h1>');
      h += '<p>' + p.name + ' · ' + longDate(s.date) + '</p>';
      if (s.pr) h += '<div class="pr-badge">' + I.crown + (s.prevBest != null ? 'Nuovo record · +' + (s.reps - s.prevBest) : 'Primo test registrato') + '</div>';
      if (s.completed && !validResult(s)) h += '<div class="rules" style="text-align:left;margin-top:14px">' + (s.skipped ? fmt(s.skipped) + ' saltati con «Salta»' : 'Test messo in pausa') + ': la sessione è salvata ma ' + (p.track === 'total' ? 'non vale come record né entra nel grafico.' : 'è esclusa dai confronti.') + '</div>';
      h += '</div>';

      h += '<div class="sum-grid">';
      h += '<div class="kpi"><div class="kpi-val">' + fmt(s.dur) + '</div><div class="kpi-lbl">Durata' + (s.completed ? '' : ' / ' + fmt(s.planned)) + '</div></div>';
      h += '<div class="kpi"><div class="kpi-val">' + s.kg + '<small>kg</small></div><div class="kpi-lbl">Peso</div></div>';
      if (s.reps != null) {
        h += '<div class="kpi"><div class="kpi-val">' + s.reps + '</div><div class="kpi-lbl">Ripetizioni</div></div>';
        h += '<div class="kpi"><div class="kpi-val">' + (tonnage(s) / 1000).toFixed(2) + '<small>t</small></div><div class="kpi-lbl">Tonnellaggio</div></div>';
      }
      h += '</div>';

      if (s.rounds && s.rounds.length) {
        var r = s.rounds, best = Math.max.apply(null, r), lastR = r[r.length - 1];
        var fi = best ? Math.round((best - lastR) / best * 100) : 0;
        h += '<div class="panel"><h4>Rep per round · media ' + (sum(r) / r.length).toFixed(1) + ' · calo migliore→ultimo ' + fi + '%</h4>' + barsHTML(r, function (i) { return i + 1; }) + '</div>';
      }
      if (s.perMin && s.perMin.length) {
        h += '<div class="panel"><h4>Ritmo minuto per minuto' + (s.prevBest != null ? ' · record precedente ' + s.prevBest : '') + '</h4>' + barsHTML(s.perMin, function (i) { return (i + 1) + '′'; }) + '</div>';
      }

      var tgt = String(p.rpe).split('-').map(Number);
      h += '<div class="panel"><h4>Com\'è andata? · RPE</h4><div class="rpe">';
      for (var i = 1; i <= 10; i++) h += '<button class="' + (s.rpe === i ? 'sel ' : '') + (i >= tgt[0] && i <= (tgt[1] || tgt[0]) ? 'target' : '') + '" data-act="rpe" data-v="' + i + '">' + i + '</button>';
      h += '</div><p class="rpe-hint">Target del protocollo: RPE ' + p.rpe + (s.rpe ? (s.rpe > (tgt[1] || tgt[0]) ? ' · sopra target: se si ripete nelle prossime sessioni, valuta un peso inferiore' : s.rpe < tgt[0] ? ' · sotto target: se si ripete nelle prossime sessioni, valuta un peso superiore' : ' · in target') : '') + '</p></div>';
      h += '<div class="panel"><h4>Note</h4><textarea class="notes" id="notes" placeholder="Sensazioni, tecnica, esercizio scelto…">' + esc(s.notes) + '</textarea></div>';

      h += '<div style="margin-top:16px" class="btn-row"><button class="btn btn-ghost" data-act="again">Ripeti</button><button class="btn btn-primary" data-act="done">Fatto</button></div>';
      h += '<button class="btn" style="margin-top:6px;color:var(--text-muted);font-size:.72rem" data-act="delSummary">Elimina sessione</button>';
      h += '</div>';
      return h;
    }

    // ───────── HISTORY ─────────
    function valhallaKgs() {
      var k = {}; history.forEach(function (x) { if (x.pid === 'valhalla' && validResult(x) && x.reps != null) k[x.kg] = 1; });
      return Object.keys(k).map(Number).sort(function (a, b) { return a - b; });
    }
    function chartKg() {
      var kgs = valhallaKgs();
      if (kgs.indexOf(ui.vkg) >= 0) return ui.vkg;
      if (kgs.indexOf(kgFor('valhalla')) >= 0) return kgFor('valhalla');
      var last = history.filter(function (x) { return x.pid === 'valhalla' && validResult(x); })[0];
      return last ? last.kg : null;
    }
    function chartValhalla() {
      var kg = chartKg();
      var pts = history.filter(function (x) { return x.pid === 'valhalla' && validResult(x) && x.reps != null && x.kg === kg; }).slice().reverse();
      if (!pts.length) return '';
      var W = 320, H = 130, pad = 22;
      var vals = pts.map(function (x) { return x.reps; });
      var mx = Math.max.apply(null, vals), mn = Math.min.apply(null, vals);
      if (mx === mn) { mx += 5; mn = Math.max(0, mn - 5); }
      var X = function (i) { return pts.length === 1 ? W / 2 : pad + i * (W - pad * 2) / (pts.length - 1); };
      var Y = function (v) { return H - pad - (v - mn) / (mx - mn) * (H - pad * 2); };
      var line = pts.map(function (x, i) { return (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(x.reps).toFixed(1); }).join(' ');
      var area = line + ' L' + X(pts.length - 1).toFixed(1) + ' ' + (H - pad) + ' L' + X(0).toFixed(1) + ' ' + (H - pad) + ' Z';
      var best = Math.max.apply(null, vals);
      var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Andamento test Valhöll">';
      s += '<defs><linearGradient id="vg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#c9b370" stop-opacity=".35"/><stop offset="1" stop-color="#c9b370" stop-opacity="0"/></linearGradient></defs>';
      s += '<line x1="' + pad + '" x2="' + (W - pad) + '" y1="' + (H - pad) + '" y2="' + (H - pad) + '" stroke="#2a2a2e"/>';
      if (pts.length > 1) s += '<path d="' + area + '" fill="url(#vg)"/><path d="' + line + '" fill="none" stroke="#c9b370" stroke-width="2" stroke-linejoin="round"/>';
      pts.forEach(function (x, i) {
        var top = x.reps === best;
        s += '<circle cx="' + X(i).toFixed(1) + '" cy="' + Y(x.reps).toFixed(1) + '" r="' + (top ? 5 : 3.5) + '" fill="' + (top ? '#e0cc8a' : '#0c0c0e') + '" stroke="#c9b370" stroke-width="2"/>';
        if (top || i === pts.length - 1 || pts.length <= 6) s += '<text x="' + X(i).toFixed(1) + '" y="' + (Y(x.reps) - 10).toFixed(1) + '" fill="#c5c2ba" font-size="10" font-weight="700" text-anchor="middle" font-family="Inter">' + x.reps + '</text>';
        if (pts.length <= 8) s += '<text x="' + X(i).toFixed(1) + '" y="' + (H - 6) + '" fill="#5f5e5a" font-size="8.5" font-weight="600" text-anchor="middle" font-family="Inter">' + new Date(x.date).toLocaleDateString('it-IT', { day: 'numeric', month: 'numeric' }) + '</text>';
      });
      return s + '</svg>';
    }

    function renderHistory() {
      var h = '<div class="wrap"><div class="page-title">Storico</div>';
      if (!history.length) {
        return h + '<div class="empty">' + I.valknut + '<p>Nessuna sessione ancora.<br>Completa un protocollo e comparirà qui.</p></div></div>';
      }
      var totT = sum(history.map(tonnage)), totMin = sum(history.map(function (x) { return x.dur; })) / 60;
      h += '<div class="kpis"><div class="kpi"><div class="kpi-val">' + history.length + '</div><div class="kpi-lbl">Sessioni</div></div>';
      h += '<div class="kpi"><div class="kpi-val">' + Math.round(totMin) + '<small>min</small></div><div class="kpi-lbl">Tempo</div></div>';
      h += '<div class="kpi"><div class="kpi-val">' + (totT / 1000).toFixed(1) + '<small>t</small></div><div class="kpi-lbl">Tonnellaggio</div></div></div>';

      var vc = chartValhalla();
      if (vc) {
        var ck = chartKg(), kgs = valhallaKgs();
        h += '<div class="section-title">Valhöll · Test snatch 5′<span>solo test validi a ' + ck + 'kg</span></div>';
        if (kgs.length > 1) h += '<div class="filter">' + kgs.map(function (k) { return '<button class="' + (k === ck ? 'on' : '') + '" data-act="vkg" data-v="' + k + '">' + k + 'kg</button>'; }).join('') + '</div>';
        h += '<div style="padding:0 16px"><div class="panel chart-wrap">' + vc + '</div></div>';
      }

      h += '<div class="section-title">Sessioni</div><div class="filter"><button class="' + (ui.filter === 'all' ? 'on' : '') + '" data-act="filter" data-v="all">Tutte</button>';
      PROTOCOLS.forEach(function (p) { if (lastFor(p.id)) h += '<button class="' + (ui.filter === p.id ? 'on' : '') + '" data-act="filter" data-v="' + p.id + '">' + p.name + '</button>'; });
      h += '</div><div class="list">';
      history.filter(function (x) { return ui.filter === 'all' || x.pid === ui.filter; }).slice(0, 200).forEach(function (x) {
        var p = byId[x.pid]; if (!p) return;
        h += '<div class="hitem" style="--accent:' + p.accent + '"><div class="hitem-icon">' + I[p.id] + '</div><div>';
        h += '<div class="hitem-title">' + p.name + (x.completed ? (validResult(x) ? '' : '<em>' + (x.skipped ? 'FASI SALTATE' : 'CON PAUSA') + '</em>') : '<em>PARZIALE</em>') + (x.pr ? ' <span style="color:var(--gold);font-size:.8rem">♛</span>' : '') + '</div>';
        h += '<div class="hitem-date">' + longDate(x.date) + '</div><div class="chips">';
        h += '<span class="chip">' + esc(x.kg) + 'kg</span><span class="chip">' + fmt(x.dur) + '</span>';
        if (x.skipped) h += '<span class="chip">' + fmt(x.skipped) + ' saltati</span>';
        if (x.reps != null) h += '<span class="chip">' + x.reps + ' rep</span>';
        if (x.rpe) h += '<span class="chip">RPE ' + x.rpe + '</span>';
        h += '</div>' + (x.notes ? '<div class="hitem-note">' + esc(x.notes) + '</div>' : '') + '</div>';
        h += '<button class="hdel" data-act="del" data-id="' + esc(x.id) + '" aria-label="Elimina">' + I.trash + '</button></div>';
      });
      h += '</div><div style="height:20px"></div></div>';
      return h;
    }

    // ───────── SETTINGS ─────────
    function toggleRow(key, label, hint) {
      return '<div class="row"><div class="row-lbl">' + label + (hint ? '<small>' + hint + '</small>' : '') + '</div><button class="toggle ' + (settings[key] ? 'on' : '') + '" role="switch" aria-checked="' + !!settings[key] + '" data-act="toggle" data-k="' + key + '" aria-label="' + label + '"></button></div>';
    }
    function segRow(key, label, hint, opts) {
      return '<div class="row"><div class="row-lbl">' + label + (hint ? '<small>' + hint + '</small>' : '') + '</div><div class="seg">' + opts.map(function (o) {
        return '<button class="' + (settings[key] === o[0] ? 'on' : '') + '" data-act="seg" data-k="' + key + '" data-v="' + o[0] + '">' + o[1] + '</button>';
      }).join('') + '</div></div>';
    }
    function renderSettings() {
      var h = '<div class="wrap"><div class="page-title">Impostazioni</div>';
      h += '<div class="section-title" style="padding-top:4px">Coach</div><div class="group">';
      h += toggleRow('sound', 'Suoni', 'Segnali di inizio e fine fase');
      h += toggleRow('voice', 'Voce coach', 'Annunci, countdown ed esercizi');
      h += segRow('voiceMode', 'Tipo di voce', settings.voiceMode === 'tts' ? 'Voce sintetica del dispositivo' : 'Registrata da Nicholas Rubini', [['nicholas', 'Nicholas'], ['tts', 'Sintetica']]);
      h += segRow('count', 'Countdown vocale', 'Ultimi secondi di ogni fase', [[0, 'Off'], [3, '3'], [5, '5']]);
      h += segRow('prep', 'Preparazione', 'Prima del primo round', [[3, '3s'], [5, '5s'], [10, '10s'], [15, '15s']]);
      h += '<div class="row"><div class="row-lbl">Volume</div><input type="range" min="0.1" max="1" step="0.05" value="' + settings.volume + '" data-input="volume" aria-label="Volume"></div>';
      if (settings.voiceMode === 'tts' && voices.length > 1) {
        h += '<div class="row"><div class="row-lbl">Voce</div><select data-input="voiceURI" aria-label="Voce">' + voices.map(function (v) {
          return '<option value="' + esc(v.voiceURI) + '"' + (v.voiceURI === settings.voiceURI ? ' selected' : '') + '>' + esc(v.name) + '</option>';
        }).join('') + '</select></div>';
      }
      if (navigator.audioSession) h += toggleRow('ignoreSilent', 'Suona in modalità silenziosa', 'Ignora l\'interruttore laterale. Può mettere in pausa la musica di altre app');
      h += '<div class="row"><div class="row-lbl">Prova audio</div><button class="link-btn" data-act="testAudio">Riproduci</button></div>';
      h += '</div>';

      h += '<div class="section-title">Feedback</div><div class="group">';
      h += toggleRow('haptics', 'Vibrazione', 'Su dispositivi supportati');
      h += toggleRow('flash', 'Flash schermo', 'Lampo colorato a ogni cambio fase');
      h += '</div>';

      h += '<div class="section-title">Dati</div><div class="group">';
      h += '<div class="row"><div class="row-lbl">Esporta storico<small>' + history.length + ' sessioni · JSON / CSV</small></div><div style="display:flex;gap:4px"><button class="link-btn" data-act="export" data-v="json">JSON</button><button class="link-btn" data-act="export" data-v="csv">CSV</button></div></div>';
      var nb = rawBackupKeys().length;
      if (nb || historyLocked) h += '<div class="row"><div class="row-lbl">Dati originali conservati<small>' + (historyLocked ? 'Salvataggio sospeso: esporta e conferma' : nb + ' copie di sicurezza dello storico') + '</small></div><button class="link-btn" data-act="exportRaw">Esporta</button></div>';
      h += '<div class="row"><div class="row-lbl">Importa storico<small>Da un backup JSON</small></div><button class="link-btn" data-act="import">Importa</button></div>';
      h += '<div class="row"><div class="row-lbl" style="color:var(--danger)">Cancella storico</div><button class="link-btn" style="color:var(--danger)" data-act="wipe">Cancella</button></div>';
      h += '</div>';

      h += '<div class="section-title">Scorciatoie da tastiera</div><div class="group"><div class="row"><div class="row-lbl"><small style="margin:0;line-height:1.8">Spazio: pausa · → salta fase · Invio: +1 rep · ⌫: −1 rep</small></div></div></div>';
      h += '<p class="version">KETTLEBELLS FOR PERFORMANCE v' + VERSION + ' · NicholasRubini.it</p></div>';
      return h;
    }

    // ───────── MODAL & TOAST ─────────
    function openModal(title, body, actions, onDismiss) {
      ui.modal = true;
      openModal.dismiss = onDismiss || null;
      var h = '<div class="modal-overlay" data-act="modalBg"><div class="modal" role="dialog" aria-modal="true"><h3>' + title + '</h3>' + (body ? '<p>' + body + '</p>' : '');
      actions.forEach(function (a, i) { h += '<button class="btn ' + (a.cls || 'btn-secondary') + '" data-act="modal" data-i="' + i + '">' + a.label + '</button>'; });
      h += '</div></div>';
      $('#modal-root').innerHTML = h;
      openModal.actions = actions;
    }
    function closeModal(dismissed) {
      ui.modal = false; $('#modal-root').innerHTML = '';
      var d = openModal.dismiss; openModal.dismiss = null;
      if (dismissed && d) d();
    }
    function toast(msg) {
      var t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t);
      setTimeout(function () { t.remove(); }, 2000);
    }

    function confirmExit() {
      var started = R.idx > 0, wasRunning = R.running;
      if (wasRunning) togglePause();
      var resume = function () { if (wasRunning && R.active && !R.running) togglePause(); };
      var acts = [{ label: 'Continua', cls: 'btn-primary', fn: resume }];
      if (started) acts.push({ label: 'Termina e salva', fn: function () { finish(false, false); } });
      acts.push({ label: 'Abbandona senza salvare', cls: 'btn-danger', fn: abandon });
      openModal('Interrompere ' + R.p.name + '?', started ? 'Timer in pausa. Puoi salvare la sessione parziale nello storico.' : 'Il workout non è ancora iniziato.', acts, resume);
    }

    // ───────── EXPORT / IMPORT ─────────
    function download(name, content, type) {
      var a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([content], { type: type }));
      a.download = name; document.body.appendChild(a); a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
    }
    function exportData(kind) {
      var stamp = new Date().toISOString().slice(0, 10);
      if (kind === 'json') return download('kb-performance-' + stamp + '.json', JSON.stringify({ app: 'kb-performance', version: VERSION, history: history }, null, 2), 'application/json');
      var rows = [['data', 'protocollo', 'kg', 'durata_effettiva_s', 'durata_prevista_s', 'completato', 'saltato_s', 'pausa', 'valido_per_record', 'record', 'rep', 'rpe', 'rep_dettaglio', 'note']];
      history.forEach(function (x) {
        rows.push([x.date, byId[x.pid].name, x.kg, x.dur, x.planned, x.completed ? 1 : 0, x.skipped || 0, x.paused ? 1 : 0, validResult(x) ? 1 : 0, x.pr ? 1 : 0, x.reps == null ? '' : x.reps, x.rpe || '', (x.rounds || x.perMin || []).join(' '), x.notes || '']);
      });
      download('kb-performance-' + stamp + '.csv', rows.map(function (r) { return r.map(function (c) { c = String(c); if (/^[=+\-@\t\r]/.test(c) && isNaN(+c)) c = "'" + c; return '"' + c.replace(/"/g, '""') + '"'; }).join(','); }).join('\n'), 'text/csv');
    }
    $('#importFile').addEventListener('change', function (e) {
      var f = e.target.files[0]; if (!f) return;
      var rd = new FileReader();
      rd.onload = function () {
        try {
          var d = JSON.parse(rd.result), list = Array.isArray(d) ? d : d && d.history;
          if (!Array.isArray(list) || list.length > 10000) throw 0;
          var clean = list.map(safeSanitize);
          var bad = clean.filter(function (x) { return !x; }).length;
          if (bad) { toast('Backup rifiutato: ' + bad + ' sessioni non valide'); e.target.value = ''; return; }
          var ids = Object.create(null); history.forEach(function (x) { ids[x.id] = 1; });
          var added = clean.filter(function (x) { if (ids[x.id]) return false; ids[x.id] = 1; return true; });
          history = history.concat(added).sort(function (a, b) { return new Date(b.date) - new Date(a.date); });
          saveHistory(); render(); toast(added.length + ' sessioni importate' + (clean.length - added.length ? ' · ' + (clean.length - added.length) + ' duplicate ignorate' : ''));
        } catch (err) { toast('File non valido'); }
        e.target.value = '';
      };
      rd.readAsText(f);
    });

    // ═══════════════════════════════════════════════════════════════
    // EVENTI (delegazione unica)
    // ═══════════════════════════════════════════════════════════════
    var ACT = {
      tab: function (el) { go(el.dataset.v); },
      home: function () { go('home'); },
      open: function (el) { unlock(); go('detail', el.dataset.id); },
      kg: function (el) {
        kgMap[ui.pid] = +el.dataset.kg; store.set('kb2_kg', kgMap);
        try { localStorage.setItem('kb_weight', el.dataset.kg); } catch (e) {}
        var y = app.scrollTop; render(); app.scrollTop = y;
      },
      start: function () { startWorkout(ui.pid); },
      pause: togglePause,
      skip: skipPhase,
      undo: undoRep,
      exit: confirmExit,
      mute: function () {
        settings.muted = !settings.muted; saveSettings();
        if (settings.muted) hush(); else unlock();
        var b = $('#muteBtn'); if (b) { b.classList.toggle('muted', settings.muted); b.innerHTML = settings.muted ? I.muted : I.volume; }
      },
      rpe: function (el) { updateEntry({ rpe: +el.dataset.v }); var y = app.scrollTop; render(); app.scrollTop = y; },
      done: function () { saveNotes(); go('home'); },
      again: function () { saveNotes(); var s = history.filter(function (x) { return x.id === ui.summaryId; })[0]; go('detail', s ? s.pid : ui.pid); },
      delSummary: function () {
        openModal('Eliminare la sessione?', 'Non verrà salvata nello storico.', [
          { label: 'Elimina', cls: 'btn-danger', fn: function () { history = history.filter(function (x) { return x.id !== ui.summaryId; }); saveHistory(); go('home'); } },
          { label: 'Annulla', fn: function () {} }]);
      },
      del: function (el) {
        var id = el.dataset.id;
        openModal('Eliminare la sessione?', 'L\'operazione non è reversibile.', [
          { label: 'Elimina', cls: 'btn-danger', fn: function () { history = history.filter(function (x) { return x.id !== id; }); saveHistory(); var y = app.scrollTop; render(); app.scrollTop = y; } },
          { label: 'Annulla', fn: function () {} }]);
      },
      filter: function (el) { ui.filter = el.dataset.v; render(); },
      vkg: function (el) { ui.vkg = +el.dataset.v; var y = app.scrollTop; render(); app.scrollTop = y; },
      toggle: function (el) {
        var k = el.dataset.k; settings[k] = !settings[k];
        if ((k === 'sound' || k === 'voice') && settings[k]) { settings.muted = false; unlock(); if (k === 'sound') sfx('test'); else say('Voce attiva', 'via'); }
        if (k === 'ignoreSilent') applyAudioSession();
        saveSettings(); render();
      },
      seg: function (el) {
        var v = el.dataset.v; settings[el.dataset.k] = isNaN(+v) ? v : +v; saveSettings(); render();
        if (el.dataset.k === 'voiceMode') { unlock(); say('Tre, due, uno, via!', ['n3', 'n2', 'n1', 'via'], 0.45); }
      },
      testAudio: function () { unlock(); var m = settings.muted; settings.muted = false; sfx('go'); setTimeout(function () { say('Tre, due, uno, via!', ['n3', 'n2', 'n1', 'via'], 0.45); settings.muted = m; }, 500); },
      export: function (el) { exportData(el.dataset.v); },
      import: function () { $('#importFile').click(); },
      exportRaw: function () { exportRawBackups(); },
      wipe: function () {
        openModal('Cancellare tutto lo storico?', 'Verranno eliminate ' + history.length + ' sessioni. Esporta un backup prima, se vuoi conservarle.', [
          { label: 'Cancella tutto', cls: 'btn-danger', fn: function () { history = []; saveHistory(); render(); toast('Storico cancellato'); } },
          { label: 'Annulla', fn: function () {} }]);
      },
      modal: function (el) { var a = openModal.actions[+el.dataset.i]; closeModal(); if (a && a.fn) a.fn(); },
      modalBg: function (el, ev) { if (ev.target === el) closeModal(true); }
    };
    document.addEventListener('click', function (ev) {
      var el = ev.target.closest('[data-act]');
      if (!el) return;
      var f = ACT[el.dataset.act];
      if (f) f(el, ev);
    });
    document.addEventListener('input', function (ev) {
      var k = ev.target.dataset && ev.target.dataset.input;
      if (k === 'volume') { settings.volume = +ev.target.value; saveSettings(); audio(); }
    });
    document.addEventListener('change', function (ev) {
      var k = ev.target.dataset && ev.target.dataset.input;
      if (k === 'volume') { tone(880, 0.12, 'sine', 0, 0.5); }
      if (k === 'voiceURI') { settings.voiceURI = ev.target.value; saveSettings(); say('Pronti. Via'); }
    });

    function updateEntry(patch) {
      for (var i = 0; i < history.length; i++) if (history[i].id === ui.summaryId) Object.assign(history[i], patch);
      saveHistory();
    }
    function saveNotes() { var n = $('#notes'); if (n) updateEntry({ notes: n.value.trim() }); }
    document.addEventListener('focusout', function (ev) { if (ev.target.id === 'notes') saveNotes(); });

    document.addEventListener('keydown', function (ev) {
      if (ui.view !== 'timer' || !R.active || ui.modal) { if (ev.key === 'Escape' && ui.modal) closeModal(true); return; }
      if (ev.key === ' ') { ev.preventDefault(); togglePause(); }
      else if (ev.key === 'ArrowRight') skipPhase();
      else if (ev.key === 'Enter' || ev.key === '+') { ev.preventDefault(); if (R.p.track) addRep(); }
      else if (ev.key === 'Backspace' || ev.key === '-') { if (R.p.track) undoRep(); }
      else if (ev.key === 'Escape') confirmExit();
    });
    document.addEventListener('gesturestart', function (e) { e.preventDefault(); }, { passive: false });

    // ───────── AVVIO ─────────
    try { history_.replaceState({ v: 'home' }, ''); } catch (e) {}
    try { render(); }
    catch (err) {
      app.innerHTML = '<div class="empty">' + I.valknut + '<p>Si è verificato un errore nel caricamento dei dati.<br>I dati salvati non sono stati modificati.</p><button class="btn btn-primary" style="margin-top:16px" data-act="exportRaw">Esporta dati originali</button></div>';
      historyLocked = true;
    }
    showLoadIssue();

    // PWA manifest
    var manifest = {
      name: 'Kettlebells for Performance', short_name: 'KB Performance', description: '7 Protocolli Kettlebell',
      start_url: location.href.split('#')[0], display: 'standalone', background_color: '#0c0c0e', theme_color: '#0c0c0e', orientation: 'portrait',
      icons: [{ src: 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect fill="#0c0c0e" width="512" height="512" rx="64"/><path fill="none" stroke="#c9b370" stroke-width="16" stroke-linejoin="round" d="M256 96L392 340H120Z M256 164L180 300H332Z M256 228L222 288H290Z"/></svg>'), sizes: '512x512', type: 'image/svg+xml', purpose: 'any maskable' }]
    };
    var ml = document.createElement('link'); ml.rel = 'manifest';
    ml.href = URL.createObjectURL(new Blob([JSON.stringify(manifest)], { type: 'application/json' }));
    document.head.appendChild(ml);
  })();
  </script>
</body>
</html>
